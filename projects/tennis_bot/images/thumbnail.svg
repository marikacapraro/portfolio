<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Tennis Court Booking Bot — a chat that checks and books courts">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFF1F4"/>
      <stop offset="1" stop-color="#E1E4E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="bubbleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- soft background + center spotlight -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <circle cx="400" cy="220" r="340" fill="url(#glow)"/>

  <!-- faint tennis-ball motif for depth -->
  <circle cx="78" cy="92" r="86" fill="#9ED11F" opacity="0.06"/>

  <!-- ===== outgoing command bubble ===== -->
  <g filter="url(#bubbleShadow)">
    <path d="M690 102 C700 114 708 118 718 119 C705 121 691 117 682 108 Z" fill="#DDF3C0"/>
    <rect x="326" y="66" width="372" height="50" rx="22" fill="#DDF3C0"/>
  </g>
  <text x="348" y="97" font-family="Manrope, sans-serif" font-size="17" fill="#0F172A"><tspan fill="#3390EC" font-weight="600">/book </tspan>12 dec court 06 at 10pm</text>
  <text x="602" y="99" font-family="Manrope, sans-serif" font-size="12" font-weight="500" fill="#7E8F72">13:53</text>
  <path d="M644 92 l3.5 3.5 l7 -8.5 M651 92 l3.5 3.5 l7 -8.5" fill="none" stroke="#54A95B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== incoming bot bubble ===== -->
  <g filter="url(#bubbleShadow)">
    <path d="M110 368 C102 381 93 388 81 390 C93 392 108 388 118 377 Z" fill="#FFFFFF"/>
    <rect x="100" y="152" width="384" height="238" rx="26" fill="#FFFFFF"/>
  </g>
  <text x="124" y="187" font-family="Manrope, sans-serif" font-size="18" font-weight="700" fill="#0F172A">📋 Ready to book:</text>
  <text x="124" y="225" font-family="Manrope, sans-serif" font-size="16" font-weight="400" fill="#1F2937">🎾 Court: Tennis Indoorterrein 06</text>
  <text x="124" y="253" font-family="Manrope, sans-serif" font-size="16" font-weight="400" fill="#1F2937">📅 Date: 12-12-2025</text>
  <text x="124" y="281" font-family="Manrope, sans-serif" font-size="16" font-weight="400" fill="#1F2937">⏰ Time: 22:00</text>
  <text x="124" y="325" font-family="Manrope, sans-serif" font-size="16" font-weight="400" fill="#1F2937">reply <tspan font-weight="700" fill="#0F172A">yes</tspan> to confirm or <tspan font-weight="700" fill="#0F172A">no</tspan> to cancel</text>
  <text x="460" y="367" text-anchor="end" font-family="Manrope, sans-serif" font-size="11" font-weight="500" fill="#AEB6C2">13:53</text>
</svg>
