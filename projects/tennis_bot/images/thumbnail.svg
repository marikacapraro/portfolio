<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Tennis Court Booking Bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- subtle court lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" fill="none">
    <rect x="60" y="60" width="680" height="480" rx="8"/>
    <line x1="400" y1="60" x2="400" y2="540"/>
    <line x1="60" y1="300" x2="740" y2="300"/>
  </g>

  <!-- user chat bubble -->
  <g filter="url(#shadow)">
    <rect x="300" y="150" width="360" height="74" rx="20" fill="#E1FFC7"/>
    <text x="324" y="195" font-family="Menlo, Consolas, monospace" font-size="22" fill="#0F172A">/check 6 dec after 7pm</text>
  </g>

  <!-- bot chat bubble -->
  <g filter="url(#shadow)">
    <rect x="120" y="250" width="420" height="120" rx="20" fill="#FFFFFF"/>
    <text x="146" y="296" font-family="Manrope, sans-serif" font-size="22" font-weight="700" fill="#0F172A">📅 3 slots available</text>
    <text x="146" y="330" font-family="Manrope, sans-serif" font-size="19" fill="#475569">Court 01 · 19:00–20:00, 20:00–21:00</text>
    <text x="146" y="356" font-family="Manrope, sans-serif" font-size="19" fill="#475569">Court 04 · 21:00–22:00</text>
  </g>

  <!-- tennis ball -->
  <g filter="url(#shadow)">
    <circle cx="660" cy="320" r="42" fill="#D9F26B"/>
    <path d="M624 300 q36 20 72 0" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <path d="M624 340 q36 -20 72 0" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  </g>

  <!-- title -->
  <text x="64" y="470" font-family="Manrope, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Tennis Court Booking Bot</text>
  <text x="64" y="508" font-family="Manrope, sans-serif" font-size="22" font-weight="500" fill="#F59E0B">Conversational UX · Built with AI</text>
</svg>
