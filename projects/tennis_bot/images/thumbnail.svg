<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Tennis Court Booking Bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- tennis court lines (top-down, filling the frame) -->
  <g stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" fill="none">
    <!-- doubles court: baselines (left/right) + doubles sidelines (top/bottom) -->
    <rect x="12" y="12" width="776" height="576"/>
    <!-- singles sidelines -->
    <line x1="12" y1="84" x2="788" y2="84"/>
    <line x1="12" y1="516" x2="788" y2="516"/>
    <!-- net -->
    <line x1="400" y1="12" x2="400" y2="588"/>
    <!-- service lines -->
    <line x1="191" y1="84" x2="191" y2="516"/>
    <line x1="609" y1="84" x2="609" y2="516"/>
    <!-- centre service line -->
    <line x1="191" y1="300" x2="609" y2="300"/>
    <!-- centre marks on the baselines -->
    <line x1="12" y1="300" x2="28" y2="300"/>
    <line x1="772" y1="300" x2="788" y2="300"/>
  </g>

  <!-- user chat bubble -->
  <rect x="300" y="150" width="360" height="74" rx="20" fill="#E1FFC7" filter="url(#shadow)"/>
  <text x="324" y="195" font-family="Menlo, Consolas, monospace" font-size="22" fill="#0F172A">/check 13 december</text>

  <!-- bot chat bubble -->
  <rect x="120" y="240" width="440" height="180" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="146" y="286" font-family="Manrope, sans-serif" font-size="22" font-weight="700" fill="#0F172A">📅 13-12-2025</text>
  <text x="146" y="320" font-family="Manrope, sans-serif" font-size="22" font-weight="700" fill="#0F172A">🎾 14 slots available</text>
  <text x="146" y="368" font-family="Manrope, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Tennis Indoorterrein 01:</text>
  <text x="146" y="400" font-family="Manrope, sans-serif" font-size="20" fill="#0F172A">• 21:00-22:00</text>

  <!-- title -->
  <text x="64" y="470" font-family="Manrope, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Tennis Court Booking Bot</text>
  <text x="64" y="508" font-family="Manrope, sans-serif" font-size="22" font-weight="500" fill="#F59E0B">Conversational UX · Built with AI</text>
</svg>
