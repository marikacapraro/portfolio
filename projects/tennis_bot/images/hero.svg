<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Tennis Court Booking Bot — booking a court through a chat">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9FBFB"/>
      <stop offset="1" stop-color="#F0F3F4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="bubbleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      /* phase wrappers (opacity only): phase 1 fades out then back in to rest; phase 2 fades out for good */
      .phase1 { animation: p1cycle 8.7s linear 0s both; }
      .phase2 { animation: p2out 8.7s linear 0s both; }

      /* phase 1 entrances */
      .cmd-enter   { animation: enterMsg 0.8s ease-out 0.30s both; transform-box: fill-box; transform-origin: center; }
      .checks      { animation: pop 0.40s ease-out 1.15s both; transform-box: fill-box; transform-origin: center; }
      .typing      { animation: typingShow 1.55s ease-out 1.30s both; }
      .dot         { animation: bounce 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .reply-enter { animation: enterMsg 0.8s ease-out 2.75s both; transform-box: fill-box; transform-origin: center; }

      /* phase 2 entrances */
      .yes-enter   { animation: enterMsg 0.8s ease-out 4.25s both; transform-box: fill-box; transform-origin: center; }
      .check-enter { animation: enterMsg 0.7s ease-out 5.00s both; transform-box: fill-box; transform-origin: center; }
      .proc-enter  { animation: enterMsg 0.7s ease-out 5.70s both; transform-box: fill-box; transform-origin: center; }
      .done-enter  { animation: enterMsg 0.7s ease-out 6.40s both; transform-box: fill-box; transform-origin: center; }

      @keyframes enterMsg   { 0% { opacity: 0; transform: translateY(22px) scale(0.97); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes pop        { 0% { opacity: 0; transform: scale(0.5); } 65% { opacity: 1; transform: scale(1.18); } 100% { transform: scale(1); } }
      @keyframes typingShow { 0% { opacity: 0; } 14% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes bounce     { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }
      /* phase 1: visible while it builds and holds, fade out at ~3.9s, stay hidden through phase 2, fade back in at ~8.1s, rest */
      @keyframes p1cycle    { 0% { opacity: 1; } 44.8% { opacity: 1; } 48.3% { opacity: 0; } 93.1% { opacity: 0; } 98.9% { opacity: 1; } 100% { opacity: 1; } }
      /* phase 2: present while it builds and holds, fade out at ~7.7s, stay hidden (phase 1 takes over) */
      @keyframes p2out      { 0% { opacity: 1; } 88.5% { opacity: 1; } 92.5% { opacity: 0; } 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .phase1 { animation: none; opacity: 1; }
        .phase2 { animation: none; opacity: 0; }
        .cmd-enter, .checks, .reply-enter, .yes-enter, .check-enter, .proc-enter, .done-enter, .dot { animation: none; opacity: 1; transform: none; }
        .typing { display: none; }
      }
    </style>
  </defs>

  <!-- soft background + center spotlight -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <circle cx="400" cy="220" r="340" fill="url(#glow)"/>

  <!-- faint tennis-ball motif for depth -->
  <circle cx="78" cy="92" r="86" fill="#9ED11F" opacity="0.06"/>

  <!-- ===================== PHASE 1 (final resting image) ===================== -->
  <g class="phase1">
    <!-- outgoing /book command -->
    <g class="cmd-enter">
      <g filter="url(#bubbleShadow)">
        <path d="M690 102 C700 114 708 118 718 119 C705 121 691 117 682 108 Z" fill="#DDF3C0"/>
        <rect x="326" y="66" width="372" height="50" rx="22" fill="#DDF3C0"/>
      </g>
      <text x="348" y="97" font-family="Manrope, sans-serif" font-size="17" fill="#0F172A"><tspan fill="#3390EC" font-weight="600">/book </tspan>12 dec court 06 at 10pm</text>
      <text x="602" y="99" font-family="Manrope, sans-serif" font-size="12" font-weight="500" fill="#7E8F72">13:53</text>
      <g class="checks">
        <path d="M644 92 l3.5 3.5 l7 -8.5 M651 92 l3.5 3.5 l7 -8.5" fill="none" stroke="#54A95B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- typing indicator (transient) -->
    <g class="typing">
      <g filter="url(#bubbleShadow)">
        <rect x="100" y="152" width="96" height="46" rx="20" fill="#FFFFFF"/>
      </g>
      <circle class="dot" cx="132" cy="175" r="4.5" fill="#C4CAD2"/>
      <circle class="dot" cx="148" cy="175" r="4.5" fill="#C4CAD2" style="animation-delay:0.15s"/>
      <circle class="dot" cx="164" cy="175" r="4.5" fill="#C4CAD2" style="animation-delay:0.30s"/>
    </g>

    <!-- incoming "Ready to book" reply -->
    <g class="reply-enter">
      <g filter="url(#bubbleShadow)">
        <path d="M110 368 C102 381 93 388 81 390 C93 392 108 388 118 377 Z" fill="#FFFFFF"/>
        <rect x="100" y="152" width="384" height="238" rx="26" fill="#FFFFFF"/>
      </g>
      <text x="124" y="187" font-family="Manrope, sans-serif" font-size="18" font-weight="700" fill="#0F172A">📋 Ready to book:</text>
      <text x="124" y="225" font-family="Manrope, sans-serif" font-size="16" font-weight="400" fill="#1F2937">🎾 Court: Tennis Indoorterrein 06</text>
      <text x="124" y="253" font-family="Manrope, sans-serif" font-size="16" font-weight="400" fill="#1F2937">📅 Date: 12-12-2025</text>
      <text x="124" y="281" font-family="Manrope, sans-serif" font-size="16" font-weight="400" fill="#1F2937">⏰ Time: 22:00</text>
      <text x="124" y="325" font-family="Manrope, sans-serif" font-size="16" font-weight="400" fill="#1F2937">reply <tspan font-weight="700" fill="#0F172A">yes</tspan> to confirm or <tspan font-weight="700" fill="#0F172A">no</tspan> to cancel</text>
      <text x="460" y="367" text-anchor="end" font-family="Manrope, sans-serif" font-size="11" font-weight="500" fill="#AEB6C2">13:53</text>
    </g>
  </g>

  <!-- ===================== PHASE 2 (transient) ===================== -->
  <g class="phase2">
    <!-- outgoing "Yes" -->
    <g class="yes-enter">
      <g filter="url(#bubbleShadow)">
        <path d="M656 158 C664 168 670 171 679 172 C668 173 657 170 650 162 Z" fill="#DDF3C0"/>
        <rect x="504" y="120" width="164" height="48" rx="22" fill="#DDF3C0"/>
      </g>
      <text x="526" y="150" font-family="Manrope, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Yes</text>
      <text x="562" y="150" font-family="Manrope, sans-serif" font-size="12.5" font-weight="500" fill="#5E8A50">13:53</text>
      <path d="M620 145 l3.5 3.5 l7 -8.5 M627 145 l3.5 3.5 l7 -8.5" fill="none" stroke="#54A95B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- incoming: checking -->
    <g class="check-enter">
      <g filter="url(#bubbleShadow)"><rect x="44" y="192" width="356" height="54" rx="26" fill="#FFFFFF"/></g>
      <text x="66" y="226" font-family="Manrope, sans-serif" font-size="20">🔍</text>
      <text x="100" y="226" font-family="Manrope, sans-serif" font-size="17" font-weight="500" fill="#1F2937">checking availability...</text>
      <text x="384" y="227" text-anchor="end" font-family="Manrope, sans-serif" font-size="12" font-weight="500" fill="#AEB6C2">13:53</text>
    </g>

    <!-- incoming: processing -->
    <g class="proc-enter">
      <g filter="url(#bubbleShadow)"><rect x="44" y="258" width="324" height="54" rx="26" fill="#FFFFFF"/></g>
      <text x="66" y="292" font-family="Manrope, sans-serif" font-size="20">⚙️</text>
      <text x="100" y="292" font-family="Manrope, sans-serif" font-size="17" font-weight="500" fill="#1F2937">processing booking...</text>
      <text x="352" y="293" text-anchor="end" font-family="Manrope, sans-serif" font-size="12" font-weight="500" fill="#AEB6C2">13:54</text>
    </g>

    <!-- incoming: confirmed -->
    <g class="done-enter">
      <g filter="url(#bubbleShadow)"><rect x="44" y="324" width="310" height="54" rx="26" fill="#FFFFFF"/></g>
      <text x="66" y="358" font-family="Manrope, sans-serif" font-size="20">✅</text>
      <text x="100" y="358" font-family="Manrope, sans-serif" font-size="17" font-weight="600" fill="#1F2937">booking confirmed!</text>
      <text x="338" y="359" text-anchor="end" font-family="Manrope, sans-serif" font-size="12" font-weight="500" fill="#AEB6C2">13:55</text>
    </g>
  </g>
</svg>
